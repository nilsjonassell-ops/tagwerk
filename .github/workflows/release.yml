# Baut bei jedem Versions-Tag (v1.2.3) den Windows-Installer und veröffentlicht
# ihn als GitHub Release. Die installierte App holt sich das Update von dort.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      - name: Versions-Tag anlegen
        shell: bash
        run: |
          V="v$(node -p "require('./package.json').version")"
          git fetch --tags --quiet
          if ! git rev-parse "$V" >/dev/null 2>&1; then
            git tag "$V"
            git push origin "$V"
          fi
          # Release vorab anlegen, damit electron-builder nicht mehrere gleichzeitig erzeugt
          gh release view "$V" >/dev/null 2>&1 || gh release create "$V" --title "${V#v}" --notes "Tagwerk ${V#v}" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Installer bauen und veröffentlichen
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --publish always 2>&1 | tee builder.log || {
            # Fehler als Annotationen ausgeben, damit sie ohne Log-Download lesbar sind
            tail -n 40 builder.log | sed 's/^/::error::/'
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Store-Paket (MSIX) bauen und anhängen
        shell: bash
        run: |
          if [ "$(node -p "require('./package.json').build.appx.identityName")" = "Platzhalter.Tagwerk" ]; then
            echo "::notice::Store-Identität noch nicht eingetragen – Store-Paket übersprungen"
            exit 0
          fi
          set -o pipefail
          V="v$(node -p "require('./package.json').version")"
          npx electron-builder --win appx --x64 --publish never 2>&1 | tee store.log || {
            # GitHub zeigt nur 10 Annotationen pro Schritt – daher alles in eine
            echo "::error::$(tail -n 30 store.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
          F=$(ls release/*.appx | head -1)
          gh release upload "$V" "$F" --clobber
          echo "::notice::Store-Paket $(basename "$F") ($(du -h "$F" | cut -f1)) am Release $V angehängt"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
