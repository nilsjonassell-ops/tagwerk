# Baut bei jedem Versions-Tag (v1.2.3) den Windows-Installer und veröffentlicht
# ihn als GitHub Release. Die installierte App holt sich das Update von dort.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      - name: Installer bauen und veröffentlichen
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --publish always 2>&1 | tee builder.log || {
            # Fehler als Annotationen ausgeben, damit sie ohne Log-Download lesbar sind
            tail -n 40 builder.log | sed 's/^/::error::/'
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
